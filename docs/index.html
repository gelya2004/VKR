<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВКР</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside></aside>
    <main>
        <h1>Заявки</h1>
        <div class="toolbar">
    		<button id="btn-new">Новая заявка</button>
   		<input type="search" id="search-input" placeholder="Поиск по номеру или организации">
	</div>
        <table id="registry-table">
            <thead>
                <tr>
                    <th>Номер</th>
                    <th>Дата</th>
                    <th>Статус</th>
                    <th>Отдел</th>
                    <th>Организация</th>
                    <th>Сумма</th>
                </tr>
            </thead>
            <tbody id="registry-body"></tbody>
        </table>
    </main>
    <aside id="card">
        <h2>Выберите заявку</h2>
    </aside>
</body>
</html>
